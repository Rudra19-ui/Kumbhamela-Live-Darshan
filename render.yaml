# Render Blueprint (Hobby / free-capable) — https://render.com/docs/free
# Requires a free Hobby workspace (no paid plan). Pick "Free" if Render still asks for instance type.
# If Blueprint flow still asks for payment, use docs/RENDER.md → "Free tier (manual)" instead.

databases:
  - name: kumbhconnect-db
    databaseName: kumbhconnect
    user: kumbhconnect
    plan: free

services:
  - type: keyvalue
    name: kumbhconnect-cache
    plan: free
    ipAllowList: []

  - type: web
    name: kumbhconnect-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: ENABLE_DEV_LOGIN
        value: "0"
      - key: SKIP_PAYMENT_CONFIRMATION
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: kumbhconnect-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: kumbhconnect-cache
          type: keyvalue
          property: connectionString
      # Mobile JWT does not need CORS; set a placeholder or your real admin site (comma-separated HTTPS origins).
      - key: CORS_ALLOWED_ORIGINS
        value: "https://example.com"
