# Render Blueprint — https://render.com/docs/blueprint-spec
# Apply: Dashboard → New → Blueprint → connect repo → select this file.
# After deploy, set EXPO_PUBLIC_API_URL on the mobile app to your web URL (https://…onrender.com).

databases:
  - name: kumbhconnect-db
    databaseName: kumbhconnect
    user: kumbhconnect
    plan: basic-256mb

services:
  # Redis-compatible cache for Django cache, Channels, Celery broker
  - type: keyvalue
    name: kumbhconnect-cache
    plan: starter
    ipAllowList: []

  - type: web
    name: kumbhconnect-api
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: ENABLE_DEV_LOGIN
        value: "0"
      - key: SKIP_PAYMENT_CONFIRMATION
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: kumbhconnect-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: kumbhconnect-cache
          type: keyvalue
          property: connectionString
      # Optional: comma-separated web admin origins (Vite/Next) if you use browser cookies there
      - key: CORS_ALLOWED_ORIGINS
        sync: false
